name: aplicar-secrets

# R22/F7 (25/11): aplica segredos no Container App a partir do RUNNER (rede
# Azure->ARM saudavel, imune ao storm 10054 da rota local Wi-Fi). Molde
# diag-logs.yml. Trigger: push do arquivo-flag aplicar-secrets.flag, cujo
# conteudo e JSON {"nome-do-secret": "valor", ...} - faz MERGE sobre a lista
# vigente (GET app + listSecrets + overlay) e faz PUT full-completo (regua:
# configuration SEMPRE leva secrets+ingress+registries juntos, nunca PATCH
# parcial). Comita de volta o estado (sem valores) e remove o flag.
# CUIDADO: o valor escrito no flag fica no historico git - segredos de
# verdade (meta-app-secret/meta-access-token) devem migrar p/ repo-secret
# antes de reusar este workflow com eles.

on:
  push:
    branches: [master]
    paths: ['aplicar-secrets.flag']

permissions:
  contents: write

concurrency:
  group: aplicar-secrets
  cancel-in-progress: true

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: GET + listSecrets + merge + PUT full
        run: |
          set -e
          az account show --query id -o tsv > /tmp/sub.txt
          SUB=$(cat /tmp/sub.txt)
          ARM="https://management.azure.com/subscriptions/$SUB/resourceGroups/rg-aicoach/providers/Microsoft.App/containerApps/aicoach-bff"
          az rest --method GET --url "$ARM?api-version=2024-03-01" > /tmp/app.json
          az rest --method POST --url "$ARM/listSecrets?api-version=2024-03-01" > /tmp/secrets.json
          python3 - <<'PYEOF'
          import json
          app = json.load(open('/tmp/app.json'))
          sec = json.load(open('/tmp/secrets.json'))['value']
          patch = json.load(open('aplicar-secrets.flag'))
          nomes = {s['name'] for s in sec}
          faltando = [n for n in patch if n not in nomes]
          assert not faltando, 'secret inexistente no app: ' + ', '.join(faltando)
          merged = [{'name': s['name'], 'value': patch.get(s['name'], s['value'])} for s in sec]
          prop = app['properties']
          conf = prop['configuration']
          corpo = {'location': app['location'], 'identity': app.get('identity'), 'tags': app.get('tags'), 'properties': {'environmentId': prop['environmentId'], 'configuration': {'activeRevisionsMode': conf['activeRevisionsMode'], 'ingress': conf['ingress'], 'registries': conf.get('registries'), 'secrets': merged}, 'template': prop['template']}}
          json.dump(corpo, open('/tmp/body.json', 'w'))
          print('secrets no merge (nomes):', ', '.join(s['name'] for s in merged))
          PYEOF
          az rest --method PUT --url "$ARM?api-version=2024-03-01" --body @/tmp/body.json --headers "Content-Type=application/json" > /tmp/put.json
          echo 'PUT enviado'

      - name: Readback do estado (sem valores) e commit de volta
        run: |
          set -e
          sleep 20
          SUB=$(cat /tmp/sub.txt)
          ARM="https://management.azure.com/subscriptions/$SUB/resourceGroups/rg-aicoach/providers/Microsoft.App/containerApps/aicoach-bff"
          az rest --method GET --url "$ARM?api-version=2024-03-01" > /tmp/st.json
          python3 - <<'PYEOF'
          import json
          st = json.load(open('/tmp/st.json'))
          p = st.get('properties', {})
          linhas = ['provisioningState: %s' % p.get('provisioningState'), 'latestRevision: %s (ready: %s)' % (p.get('latestRevisionName'), p.get('latestReadyRevisionName')), 'lastModifiedAt: %s' % st.get('systemData', {}).get('lastModifiedAt'), 'secrets nomes: %s' % ', '.join(s['name'] for s in p.get('configuration', {}).get('secrets', []))]
          texto = chr(10).join(linhas) + chr(10)
          open('estado-secrets.txt', 'w').write(texto)
          print(texto)
          PYEOF
          git config user.email "aplicar@runner.local"
          git config user.name "aplicar-runner"
          git add estado-secrets.txt
          git rm --cached aplicar-secrets.flag || true
          if git diff --cached --quiet; then
            echo NADA_A_COMITAR
            exit 0
          fi
          git commit -m "aplicar-secrets: estado apos PUT (auto via runner)"
          git push
